worker_rlimit_nofile 8192;
worker_processes auto;

events {
    worker_connections  1024;
}

http {
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Restrict TLS to modern secure versions only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # CGI endpoint - requires mutual TLS (client certificate)
    server {
        listen              8003 ssl;
        server_name         localhost;
        root                /var/cache/kubernetes/;
        ssl_certificate     /etc/kubernetes/pki/ca.crt;
        ssl_certificate_key /etc/kubernetes/pki/ca.key;

        # Require client certificate for authentication
        ssl_client_certificate /etc/kubernetes/pki/ca.crt;
        ssl_verify_client on;

        # Restrict access to cluster-internal subnet only
        allow 172.20.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        location /config/ {
            gzip off;
            fastcgi_pass    unix:/var/run/fcgiwrap.socket;
            include         /etc/nginx/fastcgi_params;
            fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # Admin config and health endpoint - requires mutual TLS
    server {
        listen              8000 ssl default_server;
        server_name         localhost;
        ssl_certificate     /etc/kubernetes/pki/ca.crt;
        ssl_certificate_key /etc/kubernetes/pki/ca.key;

        # Require client certificate for authentication
        ssl_client_certificate /etc/kubernetes/pki/ca.crt;
        ssl_verify_client on;

        # Restrict access to cluster-internal subnet only
        allow 172.20.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        location /adminconf {
            alias /etc/kubernetes/;
            index admin.conf;
            try_files $uri $uri/ =404;
        }
        location /healthz {
            # Health check does not require client cert
            ssl_verify_client off;
            proxy_pass      http://localhost:8001/healthz;
        }
    }
}
