name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # pinned: actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        # pinned: hashicorp/setup-terraform@v3
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.5.0"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Setup TFLint
        # pinned: terraform-linters/setup-tflint@v4
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.54.0

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive
        continue-on-error: true

      - name: Run tfsec
        # pinned: aquasecurity/tfsec-action@v1.0.3
        uses: aquasecurity/tfsec-action@b842f53860745310e27e7c3ea6e03bd89271bfff # v1.0.3
        with:
          soft_fail: false

      - name: Run Checkov
        # pinned: bridgecrewio/checkov-action@v12
        uses: bridgecrewio/checkov-action@99bb2cad24db47f50e04b1a81e92e4c1e2ef3e45 # v12.2956.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

      - name: PR Comment
        if: github.event_name == 'pull_request'
        # pinned: actions/github-script@v7
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const output = `#### Terraform Format and Style: \`${process.env.FMT_OUTCOME}\`
            #### Terraform Initialization: \`${process.env.INIT_OUTCOME}\`
            #### Terraform Validation: \`${process.env.VALIDATE_OUTCOME}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
